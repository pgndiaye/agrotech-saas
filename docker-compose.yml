version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agrotech_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agrotech
      POSTGRES_PASSWORD: agrotech_pass
      POSTGRES_DB: agrotech_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agrotech -d agrotech_db']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: agrotech_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://agrotech:agrotech_pass@postgres:5432/agrotech_db
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-super-secret}
      JWT_EXPIRES_IN: 7d
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-your_api_key_here}
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: production
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: agrotech_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres_data:
